# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true

# IMPORTANT: Disable caching to fix JDK transform issues
org.gradle.caching=false
org.gradle.configuration-cache=false

# Android settings
android.useAndroidX=true
android.enableJetifier=true

# Fix for JdkImageTransform issues - disable daemon to ensure clean state
org.gradle.daemon=false

# Kotlin settings
kotlin.code.style=official
kotlin.incremental=true

# Enable non-transitive R classes
android.nonTransitiveRClass=true

# Disable build features that can cause JDK issues
android.defaults.buildfeatures.buildconfig=true
